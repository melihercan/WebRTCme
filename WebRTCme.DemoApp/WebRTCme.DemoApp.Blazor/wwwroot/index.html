<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTCme.DemoApp.Blazor</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="_content/BlazorPro.Spinkit/spinkit.min.css" rel="stylesheet" />
    <link href="_content/BlazorDialog/styles.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- app.css comes last on purpose: it overrides BlazorDialog's light-page styling, and a
         stylesheet cannot override one that is linked after it. -->
    <link rel="stylesheet" href="css/app.css" />
    <link href="WebRTCme.DemoApp.Blazor.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/WebRTCme/JsInterop.js"></script>
    <script src="_content/Blazorme.StreamSaver/polyfill.min.js"></script>
    <script src="_content/Blazorme.StreamSaver/StreamSaver.min.js"></script>
    <script src="_content/BlazorDialog/blazorDialog.min.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
