name: Publish

# Publishes WebRTCme and WebRTCme.Middleware to nuget.org.
#
# This workflow builds nothing. It publishes the exact .nupkg files that a CI run produced,
# verified and uploaded - the same bytes you downloaded and tested on a PC and a Mac.
#
# That is the whole point of the rewrite. It used to rebuild and repack from scratch here, which
# meant the package that went to nuget.org had never been tested by anyone: you could test one
# artifact and ship a different one built minutes later on a different runner. NuGet has no
# TestFlight and no staging slot, and a published version is immutable - so the CI artifact is the
# staging step, and this job is only the promotion.
#
# It also makes the macOS job unnecessary here. ci.yml already built the Apple slices on a Mac and
# merged them in; doing it again would produce a different package.
#
# The two packages are always published together and never separately: WebRTCme.Middleware depends
# on WebRTCme at exactly the version it was built against, so shipping one alone leaves a
# dependency nobody can resolve.
#
# Ways in:
#   * tag v<version>  — publishes the CI artifact built from the tagged commit, then creates the
#                       GitHub release for that tag
#   * run manually    — defaults to a dry run that resolves and verifies the artifact without
#                       publishing anything. Takes an optional run-id to name the CI run.
#
# Authentication is NuGet Trusted Publishing, so no API key is stored in this repository. It needs
# a policy on nuget.org naming this repository and this workflow file. The glob must cover both
# ids: "WebRTCme.*" alone does not match "WebRTCme" itself, so list "WebRTCme" as a package
# alongside the pattern, or the first push of the main package is rejected.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run-id:
        description: 'CI run to publish. Leave empty to use the newest successful CI run for this commit.'
        type: string
        required: false
      dry-run:
        description: 'Resolve and verify the artifact, do not push to NuGet'
        type: boolean
        default: true
      skip-duplicate:
        description: 'Treat "already exists" as success (only for re-running a release already out)'
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tested packages
    # windows-latest because Verify-Packages.ps1 is Windows PowerShell reading zip central
    # directories, and because it is what the script has been exercised on. Nothing is compiled
    # here, so this job is short.
    runs-on: windows-latest

    permissions:
      # write, not read, only for the GitHub release created at the end. Nothing else here
      # writes to the repository.
      contents: write
      # Reading artifacts from another workflow run.
      actions: read
      # Lets the job request a GitHub OIDC token, which nuget.org exchanges for a
      # short-lived API key. Nothing long-lived is stored in the repository.
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      # Only for .github/scripts/Verify-Packages.ps1. The packages themselves come from the CI run,
      # not from this checkout, so this is a shallow one - none of the committed native payloads
      # are needed here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # A tag push carries no run id, so the CI run is found by commit: the newest successful one
      # for exactly this SHA. That is the enforcement, not a convenience - if CI has not run on the
      # commit being tagged, there is no tested artifact and this fails rather than quietly
      # building an untested one.
      - name: Resolve the CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.run-id }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED:-}" ]; then
            run_id="$REQUESTED"
            echo "Using the run id given: $run_id"
          else
            sha='${{ github.sha }}'
            echo "Looking for a successful CI run on $sha"
            run_id=$(gh run list \
              --workflow=ci.yml \
              --commit "$sha" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')

            if [ -z "$run_id" ]; then
              echo "::error::No successful CI run found for $sha. Run the CI workflow on this commit, test the artifact it produces, then tag it."
              exit 1
            fi
            echo "Found CI run $run_id"
          fi

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the packages that run produced
        uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}

      # The version is read from the artifact rather than from a csproj in this checkout. The two
      # can disagree - a commit could change <Version> after CI ran - and what is being published is
      # the artifact, so it is the artifact that has to be self-consistent and match the tag.
      #
      # Versions are the build date, written normalised: 26.9.14, not 26.09.14. NuGet strips
      # leading zeros, so a csproj saying 26.09.14 packs WebRTCme.26.9.14.nupkg and a tag built
      # from <Version> stops matching the file. ci.yml rejects that form before it ever gets here.
      - name: Resolve and check the version
        id: version
        run: |
          set -euo pipefail
          ls -la artifacts

          main=$(ls artifacts/WebRTCme.[0-9]*.nupkg 2>/dev/null | head -1)
          middleware=$(ls artifacts/WebRTCme.Middleware.[0-9]*.nupkg 2>/dev/null | head -1)

          if [ -z "$main" ] || [ -z "$middleware" ]; then
            echo "::error::Expected both packages in the artifact; found: $(ls artifacts)"
            exit 1
          fi

          main_version=$(basename "$main" .nupkg); main_version=${main_version#WebRTCme.}
          mw_version=$(basename "$middleware" .nupkg); mw_version=${mw_version#WebRTCme.Middleware.}

          # The middleware records a dependency on WebRTCme at whatever version it was built
          # against, so a mismatch would ship a package pointing at one that was never published.
          if [ "$main_version" != "$mw_version" ]; then
            echo "::error::WebRTCme is $main_version but WebRTCme.Middleware is $mw_version; they must match."
            exit 1
          fi

          # Catches the classic release bug: tagging one version while the artifact holds another.
          # The tag may carry the readable spelling - v26.09.15 reads as a date in a way v26.9.15
          # does not - so it is normalised before the comparison, the same way ci.yml normalises
          # before packing. Both ends agree on what NuGet would store, and a tag that genuinely
          # names a different version still fails.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag=$(echo "${GITHUB_REF_NAME#v}" |
                  awk -F. '{for(i=1;i<=NF;i++) printf "%s%s", ($i+0), (i<NF?".":"")}')
            if [ "$tag" != "$main_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME normalises to $tag, but the artifact is $main_version"
              exit 1
            fi
          fi

          echo "value=$main_version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $main_version from CI run ${{ steps.ci.outputs.run-id }}"

      # Verified again here, on the artifact about to be published rather than on the one CI
      # produced. They are the same bytes, so this should never fail - which is exactly why it is
      # cheap to keep: it proves the download was what was expected, and it is the last gate before
      # something immutable reaches nuget.org.
      #
      # -RequireAppleNativeLayout opens the Mac Catalyst .resources.zip and insists on a versioned
      # framework, so a package whose Apple slices were never merged cannot be published.
      - name: Verify packages
        shell: pwsh
        run: ./.github/scripts/Verify-Packages.ps1 -PackageDirectory artifacts -Version ${{ steps.version.outputs.value }} -RequireAppleNativeLayout

      # Trusted Publishing: swap a GitHub OIDC token for an API key that nuget.org issues for one
      # hour. Requested immediately before the push, because the key expires and each token buys
      # exactly one key.
      - name: NuGet login
        if: github.event_name == 'push' || inputs.dry-run == false
        id: login
        uses: NuGet/login@v1
        with:
          user: melihercan

      # WebRTCme goes first, so its dependency exists by the time the middleware is indexed.
      # Pushed one at a time, with the glob expanded here rather than handed to dotnet as a quoted
      # string - dotnet nuget push does not expand globs, and a failed push after a successful
      # login burns the token.
      - name: Push to NuGet
        if: github.event_name == 'push' || inputs.dry-run == false
        env:
          # A tag push never skips duplicates. --skip-duplicate cannot tell a genuine re-release
          # from a hard refusal - nuget.org answers 409 for both - so it turns a rejection into a
          # green tick. Only a manual run can ask for it, and then it is a deliberate choice.
          SKIP_DUPLICATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip-duplicate) && 'yes' || 'no' }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          skip=()
          if [ "$SKIP_DUPLICATE" = "yes" ]; then
            skip=(--skip-duplicate)
          fi
          echo "skip-duplicate: $SKIP_DUPLICATE"

          for id in WebRTCme WebRTCme.Middleware; do
            # Found rather than constructed. The digit after the id is what stops "WebRTCme."
            # also matching WebRTCme.Middleware.
            package=$(ls artifacts/$id.[0-9]*.nupkg 2>/dev/null | head -1)
            if [ -z "$package" ]; then
              echo "::error::No package found for $id in artifacts/."
              exit 1
            fi
            echo "Pushing $package"

            if dotnet nuget push "$package" \
                 --api-key "$NUGET_API_KEY" \
                 --source https://api.nuget.org/v3/index.json \
                 "${skip[@]}"; then
              continue
            fi

            # dotnet nuget push reports the status line and throws the response body away, which
            # is where nuget.org puts the reason. Ask again with curl purely to read that body,
            # then fail. X-NuGet-Client-Version is required or nuget.org answers 400 before it
            # ever looks at the package.
            echo "::group::Raw nuget.org response for $package"
            curl -sS -X PUT \
              -H "X-NuGet-ApiKey: $NUGET_API_KEY" \
              -H "X-NuGet-Client-Version: 6.0.0" \
              -F "package=@$package" \
              -D - \
              -w '\nHTTP %{http_code}\n' \
              https://www.nuget.org/api/v2/package || true
            echo "::endgroup::"

            echo "::error::Pushing $package failed; see the raw response above."
            exit 1
          done

      # The GitHub release, created only once both packages are on nuget.org, so the releases page
      # never announces a version nobody can restore.
      #
      # This used to be a manual step, and it lapsed: after 26.9.16 five versions reached nuget.org
      # and none reached the releases page, which went on calling 26.9.16 the latest for seven weeks.
      #
      # Tag pushes only. A manual dispatch has no tag to hang a release on - that is how 26.9.29
      # was published, and why it has no tag and no release.
      #
      # The notes are the annotated tag's message, so a release says what its tag says, with
      # nowhere else to keep in step. Read through the API rather than from git, because the
      # checkout above is shallow and does not carry the tag object. A lightweight tag has no
      # message, and gets a one-line release pointing at the wiki instead.
      #
      # If a release for this tag already exists - created by hand, or a re-run of this workflow -
      # it is left alone rather than overwritten.
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::A GitHub release for $tag already exists; leaving it as it is."
            exit 0
          fi

          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          message=""
          if [ "$(echo "$ref" | jq -r .object.type)" = "tag" ]; then
            message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message)
            # The first line is the tag's title ("Release as 26.11.2"), which the release
            # title already says.
            message=$(printf '%s\n' "$message" | tail -n +2 | sed '/./,$!d')
          fi
          if [ -z "$message" ]; then
            message="Release notes: https://github.com/$GITHUB_REPOSITORY/wiki/Releases"
          fi

          {
            printf '%s\n\n' "$message"
            echo "### Packages"
            echo
            echo "- [WebRTCme $VERSION](https://www.nuget.org/packages/WebRTCme/$VERSION)"
            echo "- [WebRTCme.Middleware $VERSION](https://www.nuget.org/packages/WebRTCme.Middleware/$VERSION)"
            echo
            echo "Full notes for every release are on the wiki: [Releases](https://github.com/$GITHUB_REPOSITORY/wiki/Releases)."
          } > release-notes.md

          gh release create "$tag" --verify-tag --latest --title "$tag" --notes-file release-notes.md

      # Kept against the release itself as well as against the CI run, so the published bytes stay
      # retrievable from the workflow that published them.
      - uses: actions/upload-artifact@v7
        with:
          name: published-${{ steps.version.outputs.value }}
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: |
          echo "::notice::Dry run - version ${{ steps.version.outputs.value }} from CI run ${{ steps.ci.outputs.run-id }} was resolved and verified. Nothing published."
