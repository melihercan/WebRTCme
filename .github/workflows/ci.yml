name: CI

# Builds, packs and verifies both packages exactly the way `publish.yml` does, on request.
#
# The point of the Windows/Mac split here is that CI should produce the *same* package a release
# produces. It did not before: this workflow used to run on Windows alone, which builds a flat
# Mac Catalyst WebRTC.framework that macOS refuses to codesign. Those packages restored and
# compiled fine, so nothing failed until a release - or a consumer - reached a device. Now the
# Apple slices come from a Mac and are merged in, and -RequireAppleNativeLayout fails the build
# if they did not.
#
# The uploaded `nupkg` artifact is therefore a publishable package, and is what the test jobs
# will consume.

# Manual only. This is a two-machine build of five target frameworks and it is not quick, so it is
# started when it is wanted rather than on every push.
#
# The cost of that is real and worth stating: nothing verifies a commit automatically any more, so
# a packaging fault sits undetected until somebody runs this or pushes a tag. Packaging is where
# this repository fails quietly - run it before tagging a release, not after.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack, e.g. 26.09.15. Leave empty for today''s date. Normalised either way.'
        required: false
        default: ''
      only:
        description: 'Which test job to run: all, unit, package-tests, windows, blazor, maccatalyst, ios, android, diagnostics.'
        required: false
        default: 'all'
      artifact-run-id:
        description: 'Reuse the nupkg from this earlier run instead of building one. Skips the Apple and package jobs.'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mac Catalyst's WebRTC.framework must be a versioned bundle - Versions/A plus symlinks - or
  # macOS refuses to codesign an app embedding it. Windows can neither check those symlinks out of
  # git nor write them into a zip, so that slice has to be built here. iOS comes along for the
  # ride: its xcframework is flat and does build correctly on Windows, but keeping both Apple
  # slices on one machine is one less way to be subtly wrong.
  #
  # Everything else stays on Windows, which is also the only host that can build
  # net10.0-windows10.0.22621.0 - the two csprojs add that target framework behind an
  # IsOSPlatform('windows') condition, so on any other host it does not exist and its slice would
  # go missing from the package rather than failing loudly.
  apple:
    name: Build the Apple slices
    # Also skipped when nothing that needs a package is going to run. Dispatching only=diagnostics
    # or only=unit otherwise started a two-machine build of five target frameworks that nothing
    # then consumed.
    if: inputs.artifact-run-id == '' && inputs.only != 'diagnostics' && inputs.only != 'unit'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The project rather than the solution: the solution contains net10.0-windows projects whose
      # workloads do not exist on macOS, and asking for those fails here.
      #
      # But not `workload install ios maccatalyst` either, which is the obvious thing and is wrong.
      # The builds below pass -f, which narrows what is *built* and nothing else: restore still
      # evaluates every target framework this project and its ProjectReferences declare, so
      # net10.0-android is evaluated and NETSDK1147 demands the android and maui-android workloads
      # before a single Apple slice is compiled. Restoring against the project installs what its
      # whole TargetFrameworks list needs, which on macOS excludes net10.0-windows because that one
      # is added behind an IsOSPlatform('windows') condition.
      - name: Install workloads
        run: dotnet workload restore WebRTCme/WebRTCme.csproj

      # These produce the assemblies and the .resources.zip files that carry the native
      # frameworks. build-versioned-framework.sh runs as part of the Mac Catalyst build, rebuilding
      # WebRTC.framework into the versioned layout before it is packed into the .resources.zip.
      - name: Build iOS and Mac Catalyst
        run: |
          set -euo pipefail
          dotnet build WebRTCme/WebRTCme.csproj -c Release -f net10.0-ios
          dotnet build WebRTCme/WebRTCme.csproj -c Release -f net10.0-maccatalyst

      # Fail here rather than handing a flat framework to the merge: this is the whole reason the
      # job exists, and the merge itself cannot tell the difference.
      - name: Verify the Mac Catalyst framework is versioned
        run: |
          set -euo pipefail
          zip=WebRTCme/bin/Release/net10.0-maccatalyst/WebRTCme.Bindings.Maui.MacCatalyst.resources.zip
          if unzip -l "$zip" | grep -q 'WebRTC.framework/Versions/A/WebRTC'; then
            echo "Mac Catalyst framework is versioned."
          else
            echo "::error::$zip does not contain a versioned WebRTC.framework"
            unzip -l "$zip" | head -20
            exit 1
          fi

      - name: Collect the slices
        run: |
          set -euo pipefail
          for tfm in net10.0-ios net10.0-maccatalyst; do
            mkdir -p apple/$tfm
            cp WebRTCme/bin/Release/$tfm/WebRTCme.dll                           apple/$tfm/
            cp WebRTCme/bin/Release/$tfm/WebRTCme.Bindings.Maui.*.dll           apple/$tfm/
            cp WebRTCme/bin/Release/$tfm/WebRTCme.Bindings.Maui.*.resources.zip apple/$tfm/
          done
          find apple -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: apple-slices
          path: apple/**
          if-no-files-found: error

  package:
    name: Build, pack and verify
    # Also skipped when nothing that needs a package is going to run. Dispatching only=diagnostics
    # or only=unit otherwise started a two-machine build of five target frameworks that nothing
    # then consumed.
    if: inputs.artifact-run-id == '' && inputs.only != 'diagnostics' && inputs.only != 'unit'
    needs: apple
    # windows-latest, and it is the only choice: net10.0-windows10.0.22621.0 builds nowhere else.
    # The iOS and Mac Catalyst library slices do compile here too, and pack needs them present to
    # lay the package out - the merge below then overwrites those two lib/ folders with the ones
    # built on the Mac. The Windows-built Apple slices existing and being discarded is intended,
    # not waste to optimise away.
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      # The native halves of the bindings are committed rather than downloaded - libwebrtc.aar,
      # WebRTC.xcframework, WebRTC.framework and the Windows interop DLLs - so a normal checkout
      # is enough, but it is a large one.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Reads the solution and installs exactly the workloads its target frameworks need, rather
      # than a hardcoded list that would drift.
      - name: Install MAUI workloads
        run: dotnet workload restore WebRTCme.sln

      # The version is resolved here and handed to pack, because no csproj declares one any
      # more. There was nothing to be gained by having three places agree - the csproj, the tag
      # and the file name - when only one of them can be right and NuGet decides which.
      #
      # Written either way round. Dates read naturally with the zeros in - 26.09.15 is the 15th
      # of September - but NuGet strips them, so that would pack as 26.9.15 and every file name,
      # search result and `dotnet add package` would show the stripped form. Normalised here so
      # the input is for people and the normalised version is what ships.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          stated='${{ inputs.version }}'
          raw="${stated:-$(date -u +%y.%-m.%-d)}"
          version=$(echo "$raw" | awk -F. '{for(i=1;i<=NF;i++) printf "%s%s", ($i+0), (i<NF?".":"")}')

          if [ "$version" != "$raw" ]; then
            echo "::notice::Packing $raw as $version, which is how NuGet stores it."
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # No separate restore step, and no --no-restore. The MAUI Windows app resolves runtime packs
      # per RuntimeIdentifier, and a plain solution-level restore does not fetch them: build then
      # fails with NETSDK1112 telling you to restore with a RuntimeIdentifier. Letting build do its
      # own restore gets it right.
      - name: Build
        run: dotnet build WebRTCme.sln -c Release

      # Packing is not left to release day. It is where this repository goes wrong quietly - pack
      # discards build output it does not recognise without a word - so a commit that breaks a
      # package should be found by a run of this workflow rather than by the release itself.
      #
      # No --no-build: these projects' packing targets resolve their ProjectReferences, which counts
      # as invoking Build on them, and NoBuild makes that a hard error (NETSDK1085).
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          dotnet pack WebRTCme/WebRTCme.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack WebRTCme.Middleware/WebRTCme.Middleware.csproj -c Release -o artifacts -p:Version="$VERSION"

      - uses: actions/download-artifact@v7
        with:
          name: apple-slices
          path: apple

      # Swaps the Windows-built Apple slices for the macOS ones. The .resources.zip files are
      # copied byte for byte and never unpacked - the symlinks live inside them, and rewriting one
      # on Windows would flatten the framework again.
      #
      # Only WebRTCme is merged. WebRTCme.Middleware has Apple slices too, but they are managed
      # assemblies with no native payload, so the ones Windows built are the same thing.
      #
      # The package is found rather than constructed: CI has no tag to take a version from, and the
      # digit after the id is what stops "WebRTCme." also matching WebRTCme.Middleware.
      - name: Merge the Apple slices
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/WebRTCme.*.nupkg |
                     Where-Object { $_.Name -match '^WebRTCme\.\d' } |
                     Select-Object -First 1
          if (-not $package) { throw "No WebRTCme package found in artifacts/" }
          ./.github/scripts/Merge-AppleSlices.ps1 -Package $package.FullName -AppleArtifactDirectory apple

      # Asserts every slice and native payload is present and that no folded project leaked into
      # the dependency groups. Both are things pack gets wrong in silence, and neither shows up in
      # a consumer's build - a missing framework surfaces on a device, and a leaked dependency
      # points at a package that was never published.
      #
      # -RequireAppleNativeLayout additionally opens the Mac Catalyst .resources.zip and insists on
      # a versioned framework, so a merge that silently did nothing fails here. No -Version: the
      # packages are matched by id against whatever version the csproj declares.
      - name: Verify packages
        shell: pwsh
        run: ./.github/scripts/Verify-Packages.ps1 -PackageDirectory artifacts -RequireAppleNativeLayout

      # This is a publishable package, Apple slices and all. The test jobs will consume it.
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  # ------------------------------------------------------------------ tests
  #
  # Everything below consumes the `nupkg` artifact the package job produced - the same bytes a
  # release would publish, Apple slices and all. None of these jobs builds the repository's own
  # projects against each other, because that would test the repository rather than the package,
  # and packaging is where this repository fails quietly.
  #
  # What is deliberately absent: a real Android phone and a real iPhone. A hosted runner has
  # neither, and the substitutes test the wrong binary - the Android emulator runs the x86_64 ABI
  # from libwebrtc.aar, and the iOS Simulator the simulator slice of WebRTC.xcframework, where
  # arm64 is what a user installs. Those two stay a pre-release ritual, one command each:
  #
  #   ./Tests/Test-Device-Phase4.ps1 -Platform android
  #   ./Tests/Test-Device-Phase4.ps1 -Platform ios -DeviceId <paired identifier>
  #
  # A green run here is therefore not device verification, and should not be read as it. It is
  # still worth having: both faults found on 2026-09-15 were managed-code faults - a null
  # dereference and a serialisation shape - and every job below would have caught one or the other.

  unit:
    name: Unit and integration
    timeout-minutes: 15
    # Windows, not Linux, despite this tier being pure managed code with no artifact to wait for.
    # It references the projects, those multi-target iOS and Mac Catalyst, and restore evaluates
    # every target framework a reference declares - so on Linux it fails with NETSDK1147 before a
    # single test runs. Windows is the only host that can restore all five.
    runs-on: windows-latest
    if: inputs.only == 'all' || inputs.only == 'unit'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Restored from the project rather than named: -f narrows the build and not the restore, so
      # the full set is needed whatever this tier actually compiles.
      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.Tests/WebRTCme.Tests.csproj

      # The only tier that references the projects rather than the package, and the only one that
      # needs no artifact - so it does not wait for the build and runs beside it.
      #
      # dotnet run, not dotnet test: xUnit v3 builds its own entry point, and `dotnet test` on the
      # .NET 10 SDK fails to discover these.
      - name: Tier 1
        run: dotnet run --project Tests/WebRTCme.Tests -c Release

  package-tests:
    name: Package consumption
    timeout-minutes: 25
    runs-on: windows-latest
    needs: package
    if: always() && (needs.package.result == 'success' || needs.package.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'package-tests')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # This tier compiles a consumer for every target framework the package ships, so the
      # workloads have to be here. Restoring from the project gets the right set without naming
      # them - and naming them is what goes wrong, since -f narrows the build and not the restore.
      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.PackageTests/WebRTCme.PackageTests.csproj

      - uses: actions/download-artifact@v7
        if: inputs.artifact-run-id == ''
        with:
          name: nupkg
          path: artifacts

      # Reusing a package an earlier run already built and verified. Testing one platform should
      # not cost a two-machine build of five target frameworks.
      - name: Reuse an earlier package
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact-run-id }} -n nupkg -D artifacts

      - name: Tier 2
        shell: pwsh
        run: ./Tests/Test-Package.ps1

  windows-runtime:
    name: Runtime - Windows
    timeout-minutes: 15
    runs-on: windows-latest
    needs: package
    if: always() && (needs.package.result == 'success' || needs.package.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'windows')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # This tier targets net10.0-windows10.0.22621.0, which is a platform target framework and so
      # pulls in Microsoft.Maui.Controls. Its sibling job already did this; this one did not, and a
      # missing workload is one of the few things that could explain a silent six-hour hang here.
      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.DeviceTests/WebRTCme.DeviceTests.csproj

      - uses: actions/download-artifact@v7
        if: inputs.artifact-run-id == ''
        with:
          name: nupkg
          path: artifacts

      # Reusing a package an earlier run already built and verified. Testing one platform should
      # not cost a two-machine build of five target frameworks.
      - name: Reuse an earlier package
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact-run-id }} -n nupkg -D artifacts

      # Loads WebRtcInterop.dll and negotiates between two peer connections in one process.
      #
      # A hosted runner has no camera and no microphone, which makes this more interesting than it
      # sounds rather than less: creating a peer connection goes through libwebrtc's audio device
      # module, and that module is what stopped counting inputs after a call in the bug fixed on
      # 2026-09-14. If this job turns out to skip the enumeration scenarios, or to fail outright on
      # a machine with no audio at all, that is worth knowing and is written down here rather than
      # assumed either way.
      # What this machine has for audio, before anything tries to use it.
      #
      # The first RTCPeerConnection resolves WebRtcRuntime.Factory, which calls Initialize() and
      # FactoryCreate() - two synchronous P/Invokes - and FactoryCreate builds libwebrtc's audio
      # device module over Core Audio. A hosted runner has no audio hardware and does not run the
      # Windows Audio service, and Core Audio can block rather than fail when that service is
      # stopped. That is the current hypothesis for this tier hanging here with no output while
      # passing everywhere else; see doc/KnownGaps.md.
      #
      # Never fails the job. It is here to describe the machine, not to judge it.
      - name: What audio hardware is present
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "--- audio services ---"
          Get-Service -Name 'Audiosrv','AudioEndpointBuilder' -ErrorAction SilentlyContinue |
            Format-Table -AutoSize Name, Status, StartType | Out-String | Write-Host
          Write-Host "--- audio endpoints (Win32_SoundDevice) ---"
          $sound = Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue
          if ($sound) { $sound | Format-Table -AutoSize Name, Status | Out-String | Write-Host }
          else { Write-Host "  none" }
          Write-Host "--- media class devices ---"
          $media = Get-CimInstance Win32_PnPEntity -ErrorAction SilentlyContinue |
            Where-Object { $_.PNPClass -in @('MEDIA','AudioEndpoint') }
          if ($media) { $media | Format-Table -AutoSize Name, Status | Out-String | Write-Host }
          else { Write-Host "  none" }

      # Telemetry off for both the SDK and the test platform. Neither is known to be the cause,
      # and both phone home on startup - which is the window this process hangs in, having loaded
      # its assembly and never reached the xUnit banner. Cheap to rule out, and worth ruling out
      # before anything more invasive.
      # The Windows App Runtime, which this machine does not have and the tier cannot start
      # without.
      #
      # WebRTCme is a MAUI library on Windows, so its package depends on Microsoft.Maui.Controls,
      # which brings the Windows App SDK, which injects a bootstrapper into the module constructor
      # of anything referencing it. That bootstrapper looks for a matching Windows App Runtime
      # framework package - and when it cannot find one it does not fail, it blocks. The process
      # then hangs before Main with nothing written, which is what cost six hours and six rounds
      # of wrong theories before a stack dump named it.
      #
      # Version 1.8 because that is what Microsoft.WindowsAppSDK resolves to here
      # (1.8.260529003) and the bootstrapper matches on major.minor.
      #
      # A developer machine has this already - the MAUI workload installs it. A bare one does not,
      # and neither does an end user running an unpackaged app; see doc/KnownGaps.md.
      - name: Install the Windows App Runtime
        shell: pwsh
        run: |
          $url = "https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "windowsappruntimeinstall-x64.exe"

          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing

          Write-Host "Installing..."
          $p = Start-Process -FilePath $exe -ArgumentList "--quiet" -PassThru -Wait
          Write-Host "installer exit: $($p.ExitCode)"

          # Not fatal on its own: the tier will say soon enough whether it worked, and a
          # non-zero code here is often "already installed".
          Get-AppxPackage -Name "Microsoft.WindowsAppRuntime*" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  registered: $($_.Name) $($_.Version)" }
      - name: Tier 3
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
          # The test platform's own startup log. This process loads its assembly and then never
          # reaches Main - not even for its help switch - so the only remaining witness is whatever
          # the platform writes about itself on the way up.
          TESTINGPLATFORM_DIAGNOSTIC: 1
          TESTINGPLATFORM_DIAGNOSTIC_VERBOSITY: Trace
          TESTINGPLATFORM_DIAGNOSTIC_OUTPUT_DIRECTORY: ${{ github.workspace }}/testdiag
        run: ./Tests/Test-Device.ps1

      # Always, because the interesting case is the one where the step above failed.
      - name: Test platform diagnostics
        if: always()
        shell: pwsh
        run: |
          $dir = "${{ github.workspace }}/testdiag"
          if (-not (Test-Path $dir)) { Write-Host "no diagnostic directory - the platform wrote nothing"; return }
          Get-ChildItem $dir -Recurse -File | ForEach-Object {
            Write-Host "===== $($_.Name) ($($_.Length) bytes) ====="
            Get-Content $_.FullName -TotalCount 200 | ForEach-Object { Write-Host $_ }
          }

  blazor:
    name: Runtime - Blazor
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: package
    if: always() && (needs.package.result == 'success' || needs.package.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'blazor')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The Blazor host reaches the scenarios through WebRTCme.DeviceTests.Core, which also targets
      # Android - so the Android workload has to be here even though nothing Android is built.
      # Restore evaluates every target framework a reference declares; -f narrows only the build.
      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.BlazorTestHost/WebRTCme.BlazorTestHost.csproj

      - uses: actions/download-artifact@v7
        if: inputs.artifact-run-id == ''
        with:
          name: nupkg
          path: artifacts

      # Reusing a package an earlier run already built and verified. Testing one platform should
      # not cost a two-machine build of five target frameworks.
      - name: Reuse an earlier package
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact-run-id }} -n nupkg -D artifacts

      # No hardware at all: Chromium is launched with its fake-media-device switches, so there is a
      # synthetic camera and microphone. The one tier that is as good in CI as it is locally.
      - name: Tier 5
        shell: pwsh
        run: ./Tests/Test-Blazor.ps1

  maccatalyst:
    name: Runtime - Mac Catalyst
    timeout-minutes: 30
    runs-on: macos-latest
    needs: package
    if: always() && (needs.package.result == 'success' || needs.package.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'maccatalyst')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.DeviceTests.Runner/WebRTCme.DeviceTests.Runner.csproj

      - uses: actions/download-artifact@v7
        if: inputs.artifact-run-id == ''
        with:
          name: nupkg
          path: artifacts

      # Reusing a package an earlier run already built and verified. Testing one platform should
      # not cost a two-machine build of five target frameworks.
      - name: Reuse an earlier package
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact-run-id }} -n nupkg -D artifacts

      # -Local: the Mac is this machine rather than the Mac mini over SSH. No signing identity is
      # needed to run a Catalyst app from its own build output, and no window server session
      # either, which is what makes this one as good here as it is on real hardware - it IS real
      # hardware, and the same slice a user gets.
      - name: Tier 4 - Mac Catalyst
        shell: pwsh
        run: ./Tests/Test-Device-Phase4.ps1 -Platform maccatalyst -Local

  ios-simulator:
    name: Runtime - iOS Simulator
    timeout-minutes: 40
    runs-on: macos-latest
    needs: package
    if: always() && (needs.package.result == 'success' || needs.package.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'ios')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.DeviceTests.Runner/WebRTCme.DeviceTests.Runner.csproj

      - uses: actions/download-artifact@v7
        if: inputs.artifact-run-id == ''
        with:
          name: nupkg
          path: artifacts

      # Reusing a package an earlier run already built and verified. Testing one platform should
      # not cost a two-machine build of five target frameworks.
      - name: Reuse an earlier package
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact-run-id }} -n nupkg -D artifacts

      # The Simulator, not a phone, with everything that implies - see the note at the top of this
      # section. The simulator is chosen from whatever the runner image has rather than pinned to a
      # model, which would break the day GitHub changes the image.
      - name: Tier 4 - iOS Simulator
        shell: pwsh
        run: ./Tests/Test-Device-Phase4.ps1 -Platform ios -Local -Simulator

  android-emulator:
    name: Runtime - Android emulator
    timeout-minutes: 45

    # Reports, does not gate. libwebrtc aborts on this emulator about two runs in three - a native
    # SIGABRT on its signaling thread, around the scenario that enumerates devices, completes a call
    # and enumerates again. The arm64 phone has never done it; the emulator runs x86_64, which no
    # user does. Which RTC_CHECK fails cannot be found from here: the .aar is prebuilt and stripped,
    # and the assertion text reaches neither logcat nor a readable tombstone. See doc/KnownGaps.md.
    #
    # Kept rather than deleted because of what it does catch reliably: managed regressions. Both
    # faults found on 2026-09-15 were of that kind, and this job would have caught either. A failure
    # here is worth reading - it is just not worth failing a release over, and a gate that is a coin
    # toss is one people learn to ignore.
    #
    # Android is gated by the real phone instead, which is one command:
    #   ./Tests/Test-Device-Phase4.ps1 -Platform android
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: package
    if: always() && (needs.package.result == 'success' || needs.package.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'android')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Jars/libwebrtc.aar is compiled for Java 21 - class file version 65 - and the runner
      # defaults to a JDK that will not read it:
      #
      #   error: cannot access DataChannel ... bad class file: .../classes.jar
      #   class file has wrong version 65.0, should be 61.0
      #
      # 61 is Java 17. This machine builds it because its own javac is newer; the runner needs
      # telling. Worth knowing for anyone consuming the package on Android too, not just CI.
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.DeviceTests.Runner/WebRTCme.DeviceTests.Runner.csproj

      - uses: actions/download-artifact@v7
        if: inputs.artifact-run-id == ''
        with:
          name: nupkg
          path: artifacts

      # Reusing a package an earlier run already built and verified. Testing one platform should
      # not cost a two-machine build of five target frameworks.
      - name: Reuse an earlier package
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact-run-id }} -n nupkg -D artifacts

      # The emulator needs hardware acceleration, and a hosted Linux runner only grants /dev/kvm to
      # a user in the kvm group. Without this the emulator either refuses to start or falls back to
      # software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # An emulator is just another adb device, so the harness needs no emulator-specific path - it
      # builds, installs with -t:Install and reads logcat exactly as it does with a phone.
      #
      # x86_64 deliberately: that is the only ABI with a usable emulator image, and it is also the
      # honest limitation of this job - libwebrtc.aar's arm64 ABI is the one that reaches a user's
      # phone, and nothing here loads it.
      - name: Tier 4 - Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: pwsh ./Tests/Test-Device-Phase4.ps1 -Platform android

  # ------------------------------------------------------------------ why does tier 3 not start?
  #
  # Not part of the suite. Two of the smallest programs that can be written, run to answer a
  # question four rounds of guessing could not - see Tests/Diagnostics/README.md.
  #
  # WebRTCme.DeviceTests loads its assembly on this runner and then produces nothing: no xUnit
  # banner, no test, nothing even when asked only for its help text. It differs from the unit tier,
  # which passes on this same image, in two ways at once - a Windows platform target framework with
  # a win-x64 runtime identifier, and everything it references - so neither can be blamed from that
  # evidence alone.
  #
  # These two share the target framework and runtime identifier and differ only in whether xUnit is
  # present. Whichever hangs is the answer.
  #
  # Never fails the run. It is an experiment, and an experiment that comes out badly is a result.
  windows-diagnostics:
    name: Diagnose the Windows tier
    timeout-minutes: 20
    runs-on: windows-latest
    if: inputs.only == 'diagnostics'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The fourth probe references the package, so it needs one. Reused from an earlier run rather
      # than built here - pass artifact-run-id when dispatching only=diagnostics.
      - name: Reuse an earlier package
        if: inputs.artifact-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact-run-id }} -n nupkg -D artifacts

      # Defender, and whether it is the answer.
      #
      # The package puts 27 MB of unsigned native DLLs beside the executable - WebRtcInterop.dll,
      # boringssl, protobuf, the MSVC runtime. Merely referencing the package stops the process
      # starting on this machine, while the same program without it runs in under a second, and
      # nothing in the test calls into any of it. Real-time scanning of those files on first
      # execution would look exactly like that: nothing to do with the code, first run only, and
      # only where a scanner is watching.
      #
      # This run excludes the workspace. If the package probe then runs, that is the answer, and it
      # is a property of the machine rather than a fault in the package.
      - name: Exclude the workspace from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          try {
              Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
              Write-Host "excluded ${{ github.workspace }}"
              (Get-MpPreference).ExclusionPath | ForEach-Object { Write-Host "  now excluded: $_" }
          } catch {
              Write-Host "could not set an exclusion: $($_.Exception.Message)"
          }

          $d = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($d) { Write-Host "real-time protection: $($d.RealTimeProtectionEnabled)" }
          else { Write-Host "Defender status unavailable" }

      - name: Build the probes
        shell: pwsh
        run: |
          dotnet build Tests/Diagnostics/PlainConsole/PlainConsole.csproj -c Release --nologo
          dotnet build Tests/Diagnostics/MinimalXunit/MinimalXunit.csproj -c Release --nologo
          dotnet build Tests/Diagnostics/XunitWithTestSdk/XunitWithTestSdk.csproj -c Release --nologo

          if (Test-Path artifacts) {
              $pkg = Get-ChildItem artifacts -Filter "WebRTCme.*.nupkg" |
                     Where-Object { $_.Name -match '^WebRTCme\.\d' } | Select-Object -First 1
              $version = $pkg.BaseName -replace '^WebRTCme\.', ''
              Write-Host "Package probe against $version"
              dotnet build Tests/Diagnostics/XunitWithPackage/XunitWithPackage.csproj -c Release --nologo `
                  "-p:WebRTCmePackageVersion=$version" "-p:RestoreAdditionalProjectSources=$PWD/artifacts"
          } else {
              Write-Host "No package supplied - skipping the package probe (pass artifact-run-id)."
          }

      # Each under a watchdog, because the thing being measured is whether they finish at all.
      # Output is redirected to files and printed afterwards, so it survives a process being
      # killed - the same reason tier 3 does it.
      # What is the stuck process actually doing?
      #
      # Five hypotheses have been wrong - the target framework, xUnit, Microsoft.NET.Test.Sdk,
      # Defender, the app-local MSVC runtime - and the package has no module initializer, no static
      # constructor that does work, and only lazy LibraryImport stubs. Guessing has run out.
      #
      # dotnet-stack prints the managed stacks of a live process. Started, left to hang, and asked
      # directly. Whatever is at the top of that stack is the answer.
      - name: Stack of the hung process
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $tfm = "net10.0-windows10.0.22621.0/win-x64"
          $exe = "Tests/Diagnostics/XunitWithPackage/bin/Release/$tfm/XunitWithPackage.exe"
          if (-not (Test-Path $exe)) { Write-Host "no package probe was built"; exit 0 }

          dotnet tool install -g dotnet-stack 2>&1 | Out-String | Write-Host
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet	ools"

          $out = New-TemporaryFile
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow `
               -RedirectStandardOutput $out -RedirectStandardError "$out.err"

          Write-Host "started pid $($p.Id); letting it sit for 40s"
          Start-Sleep -Seconds 40

          if ($p.HasExited) {
              Write-Host "it exited on its own this time - nothing to dump"
          } else {
              Write-Host ""
              Write-Host "===== managed stacks ====="
              & dotnet-stack report -p $p.Id 2>&1 | ForEach-Object { Write-Host $_ }
              try { $p.Kill($true) } catch { }
          }

          Write-Host ""
          Write-Host "===== whatever it wrote ====="
          Get-Content $out, "$out.err" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }

      - name: Run them
        shell: pwsh
        run: |
          function Invoke-Probe {
              param([string] $What, [string] $Exe, [string[]] $Arguments = @(), [int] $Seconds = 180)

              Write-Host ""
              Write-Host "===== $What ====="

              if (-not (Test-Path $Exe)) { Write-Host "  not built: $Exe"; return "NOT BUILT" }

              $out = New-TemporaryFile
              $err = New-TemporaryFile
              $p = Start-Process -FilePath $Exe -ArgumentList $Arguments -PassThru -NoNewWindow `
                   -RedirectStandardOutput $out -RedirectStandardError $err

              $finished = $p.WaitForExit($Seconds * 1000)
              if (-not $finished) { try { $p.Kill($true) } catch { } }

              Get-Content $out, $err -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
              Remove-Item $out, $err -Force -ErrorAction SilentlyContinue

              if ($finished) { Write-Host "  -> finished, exit $($p.ExitCode)"; return "RAN" }
              Write-Host "  -> HUNG, killed after ${Seconds}s"
              return "HUNG"
          }

          $tfm = "net10.0-windows10.0.22621.0/win-x64"
          $plain = Invoke-Probe "PlainConsole - no xUnit at all" `
                     "Tests/Diagnostics/PlainConsole/bin/Release/$tfm/PlainConsole.exe"
          $xunit = Invoke-Probe "MinimalXunit - one trivial fact" `
                     "Tests/Diagnostics/MinimalXunit/bin/Release/$tfm/MinimalXunit.exe"
          $help  = Invoke-Probe "MinimalXunit --help - startup only, no tests" `
                     "Tests/Diagnostics/MinimalXunit/bin/Release/$tfm/MinimalXunit.exe" @("--help") 180
          $sdk   = Invoke-Probe "XunitWithTestSdk - adds Microsoft.NET.Test.Sdk" `
                     "Tests/Diagnostics/XunitWithTestSdk/bin/Release/$tfm/XunitWithTestSdk.exe"
          $pkg   = Invoke-Probe "XunitWithPackage - adds the WebRTCme package" `
                     "Tests/Diagnostics/XunitWithPackage/bin/Release/$tfm/XunitWithPackage.exe" @() 180

          # If the package is what stops it, which of its files?
          #
          # It ships the MSVC C runtime app-local - vcruntime140, msvcp140 and friends - and the
          # Windows loader prefers a DLL beside the executable over the system copy. A CRT loaded
          # from the wrong place is a known way to deadlock during startup, and it would explain a
          # process that prints from a module initializer and then never reaches Main.
          #
          # So: take those four away and run the same executable again. Nothing else changes.
          if ($pkg -eq "HUNG") {
              $dir = "Tests/Diagnostics/XunitWithPackage/bin/Release/$tfm"
              Write-Host ""
              Write-Host "===== the same executable, without the app-local MSVC runtime ====="
              Get-ChildItem $dir -Filter "*.dll" |
                  Where-Object { $_.Name -match '^(vcruntime140|msvcp140|concrt140|libc\+\+)' } |
                  ForEach-Object { Write-Host "  removing $($_.Name)"; Remove-Item $_.FullName -Force }

              $noCrt = Invoke-Probe "XunitWithPackage minus the MSVC runtime" `
                         "$dir/XunitWithPackage.exe" @() 180
          } else { $noCrt = "n/a" }

          Write-Host ""
          Write-Host "===== verdict ====="
          Write-Host "  PlainConsole      : $plain"
          Write-Host "  MinimalXunit      : $xunit"
          Write-Host "  MinimalXunit help : $help"
          Write-Host "  XunitWithTestSdk  : $sdk"
          Write-Host "  XunitWithPackage  : $pkg"
          Write-Host "  ... minus MSVC CRT : $noCrt"
          Write-Host ""

          if ($pkg -eq "HUNG" -and $noCrt -eq "RAN") {
              Write-Host "  The package ships the MSVC C runtime beside the executable, and the"
              Write-Host "  Windows loader prefers those over the system copies. Removing them is"
              Write-Host "  enough to make the same program start. That is a packaging fault, and it"
              Write-Host "  reaches consumers, not just CI."
          } elseif ($pkg -eq "HUNG" -and $sdk -eq "RAN") {
              Write-Host "  Referencing the WebRTCme package is enough to stop the process starting,"
              Write-Host "  without anything calling into it. The cost is in loading or laying the"
              Write-Host "  package out, not in what it does."
          } elseif ($sdk -eq "HUNG" -and $xunit -eq "RAN") {
              Write-Host "  The only difference between those two is Microsoft.NET.Test.Sdk and"
              Write-Host "  xunit.runner.visualstudio, so those are the cause - and xUnit v3 needs"
              Write-Host "  neither, since it brings its own entry point."
          } elseif ($plain -eq "HUNG") {
              Write-Host "  A bare Windows-target executable does not start on this machine."
              Write-Host "  xUnit is innocent; the fault is the target framework, the runtime"
              Write-Host "  identifier or the apphost on this image."
          } elseif ($xunit -eq "HUNG" -or $help -eq "HUNG") {
              Write-Host "  A bare executable runs and the same thing with xUnit does not."
              Write-Host "  xUnit v3 on a Windows platform target framework is the answer."
          } else {
              Write-Host "  Both run. So neither the target framework nor xUnit is sufficient on its"
              Write-Host "  own, and the cause is something WebRTCme.DeviceTests adds on top -"
              Write-Host "  the package and its native payload, or Microsoft.NET.Test.Sdk."
          }
