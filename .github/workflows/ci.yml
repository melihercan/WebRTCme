name: CI

# Builds, packs and verifies both packages exactly the way `publish.yml` does, on request.
#
# The point of the Windows/Mac split here is that CI should produce the *same* package a release
# produces. It did not before: this workflow used to run on Windows alone, which builds a flat
# Mac Catalyst WebRTC.framework that macOS refuses to codesign. Those packages restored and
# compiled fine, so nothing failed until a release - or a consumer - reached a device. Now the
# Apple slices come from a Mac and are merged in, and -RequireAppleNativeLayout fails the build
# if they did not.
#
# The uploaded `nupkg` artifact is therefore a publishable package, and is what the test jobs
# will consume.

# Manual only. This is a two-machine build of five target frameworks and it is not quick, so it is
# started when it is wanted rather than on every push.
#
# The cost of that is real and worth stating: nothing verifies a commit automatically any more, so
# a packaging fault sits undetected until somebody runs this or pushes a tag. Packaging is where
# this repository fails quietly - run it before tagging a release, not after.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack, e.g. 26.09.15. Leave empty for today''s date. Normalised either way.'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mac Catalyst's WebRTC.framework must be a versioned bundle - Versions/A plus symlinks - or
  # macOS refuses to codesign an app embedding it. Windows can neither check those symlinks out of
  # git nor write them into a zip, so that slice has to be built here. iOS comes along for the
  # ride: its xcframework is flat and does build correctly on Windows, but keeping both Apple
  # slices on one machine is one less way to be subtly wrong.
  #
  # Everything else stays on Windows, which is also the only host that can build
  # net10.0-windows10.0.22621.0 - the two csprojs add that target framework behind an
  # IsOSPlatform('windows') condition, so on any other host it does not exist and its slice would
  # go missing from the package rather than failing loudly.
  apple:
    name: Build the Apple slices
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The project rather than the solution: the solution contains net10.0-windows projects whose
      # workloads do not exist on macOS, and asking for those fails here.
      #
      # But not `workload install ios maccatalyst` either, which is the obvious thing and is wrong.
      # The builds below pass -f, which narrows what is *built* and nothing else: restore still
      # evaluates every target framework this project and its ProjectReferences declare, so
      # net10.0-android is evaluated and NETSDK1147 demands the android and maui-android workloads
      # before a single Apple slice is compiled. Restoring against the project installs what its
      # whole TargetFrameworks list needs, which on macOS excludes net10.0-windows because that one
      # is added behind an IsOSPlatform('windows') condition.
      - name: Install workloads
        run: dotnet workload restore WebRTCme/WebRTCme.csproj

      # These produce the assemblies and the .resources.zip files that carry the native
      # frameworks. build-versioned-framework.sh runs as part of the Mac Catalyst build, rebuilding
      # WebRTC.framework into the versioned layout before it is packed into the .resources.zip.
      - name: Build iOS and Mac Catalyst
        run: |
          set -euo pipefail
          dotnet build WebRTCme/WebRTCme.csproj -c Release -f net10.0-ios
          dotnet build WebRTCme/WebRTCme.csproj -c Release -f net10.0-maccatalyst

      # Fail here rather than handing a flat framework to the merge: this is the whole reason the
      # job exists, and the merge itself cannot tell the difference.
      - name: Verify the Mac Catalyst framework is versioned
        run: |
          set -euo pipefail
          zip=WebRTCme/bin/Release/net10.0-maccatalyst/WebRTCme.Bindings.Maui.MacCatalyst.resources.zip
          if unzip -l "$zip" | grep -q 'WebRTC.framework/Versions/A/WebRTC'; then
            echo "Mac Catalyst framework is versioned."
          else
            echo "::error::$zip does not contain a versioned WebRTC.framework"
            unzip -l "$zip" | head -20
            exit 1
          fi

      - name: Collect the slices
        run: |
          set -euo pipefail
          for tfm in net10.0-ios net10.0-maccatalyst; do
            mkdir -p apple/$tfm
            cp WebRTCme/bin/Release/$tfm/WebRTCme.dll                           apple/$tfm/
            cp WebRTCme/bin/Release/$tfm/WebRTCme.Bindings.Maui.*.dll           apple/$tfm/
            cp WebRTCme/bin/Release/$tfm/WebRTCme.Bindings.Maui.*.resources.zip apple/$tfm/
          done
          find apple -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: apple-slices
          path: apple/**
          if-no-files-found: error

  package:
    name: Build, pack and verify
    needs: apple
    # windows-latest, and it is the only choice: net10.0-windows10.0.22621.0 builds nowhere else.
    # The iOS and Mac Catalyst library slices do compile here too, and pack needs them present to
    # lay the package out - the merge below then overwrites those two lib/ folders with the ones
    # built on the Mac. The Windows-built Apple slices existing and being discarded is intended,
    # not waste to optimise away.
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      # The native halves of the bindings are committed rather than downloaded - libwebrtc.aar,
      # WebRTC.xcframework, WebRTC.framework and the Windows interop DLLs - so a normal checkout
      # is enough, but it is a large one.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Reads the solution and installs exactly the workloads its target frameworks need, rather
      # than a hardcoded list that would drift.
      - name: Install MAUI workloads
        run: dotnet workload restore WebRTCme.sln

      # The version is resolved here and handed to pack, because no csproj declares one any
      # more. There was nothing to be gained by having three places agree - the csproj, the tag
      # and the file name - when only one of them can be right and NuGet decides which.
      #
      # Written either way round. Dates read naturally with the zeros in - 26.09.15 is the 15th
      # of September - but NuGet strips them, so that would pack as 26.9.15 and every file name,
      # search result and `dotnet add package` would show the stripped form. Normalised here so
      # the input is for people and the normalised version is what ships.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          stated='${{ inputs.version }}'
          raw="${stated:-$(date -u +%y.%-m.%-d)}"
          version=$(echo "$raw" | awk -F. '{for(i=1;i<=NF;i++) printf "%s%s", ($i+0), (i<NF?".":"")}')

          if [ "$version" != "$raw" ]; then
            echo "::notice::Packing $raw as $version, which is how NuGet stores it."
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # No separate restore step, and no --no-restore. The MAUI Windows app resolves runtime packs
      # per RuntimeIdentifier, and a plain solution-level restore does not fetch them: build then
      # fails with NETSDK1112 telling you to restore with a RuntimeIdentifier. Letting build do its
      # own restore gets it right.
      - name: Build
        run: dotnet build WebRTCme.sln -c Release

      # Packing is not left to release day. It is where this repository goes wrong quietly - pack
      # discards build output it does not recognise without a word - so a commit that breaks a
      # package should be found by a run of this workflow rather than by the release itself.
      #
      # No --no-build: these projects' packing targets resolve their ProjectReferences, which counts
      # as invoking Build on them, and NoBuild makes that a hard error (NETSDK1085).
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          dotnet pack WebRTCme/WebRTCme.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack WebRTCme.Middleware/WebRTCme.Middleware.csproj -c Release -o artifacts -p:Version="$VERSION"

      - uses: actions/download-artifact@v7
        with:
          name: apple-slices
          path: apple

      # Swaps the Windows-built Apple slices for the macOS ones. The .resources.zip files are
      # copied byte for byte and never unpacked - the symlinks live inside them, and rewriting one
      # on Windows would flatten the framework again.
      #
      # Only WebRTCme is merged. WebRTCme.Middleware has Apple slices too, but they are managed
      # assemblies with no native payload, so the ones Windows built are the same thing.
      #
      # The package is found rather than constructed: CI has no tag to take a version from, and the
      # digit after the id is what stops "WebRTCme." also matching WebRTCme.Middleware.
      - name: Merge the Apple slices
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/WebRTCme.*.nupkg |
                     Where-Object { $_.Name -match '^WebRTCme\.\d' } |
                     Select-Object -First 1
          if (-not $package) { throw "No WebRTCme package found in artifacts/" }
          ./.github/scripts/Merge-AppleSlices.ps1 -Package $package.FullName -AppleArtifactDirectory apple

      # Asserts every slice and native payload is present and that no folded project leaked into
      # the dependency groups. Both are things pack gets wrong in silence, and neither shows up in
      # a consumer's build - a missing framework surfaces on a device, and a leaked dependency
      # points at a package that was never published.
      #
      # -RequireAppleNativeLayout additionally opens the Mac Catalyst .resources.zip and insists on
      # a versioned framework, so a merge that silently did nothing fails here. No -Version: the
      # packages are matched by id against whatever version the csproj declares.
      - name: Verify packages
        shell: pwsh
        run: ./.github/scripts/Verify-Packages.ps1 -PackageDirectory artifacts -RequireAppleNativeLayout

      # This is a publishable package, Apple slices and all. The test jobs will consume it.
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  # ------------------------------------------------------------------ tests
  #
  # Everything below consumes the `nupkg` artifact the package job produced - the same bytes a
  # release would publish, Apple slices and all. None of these jobs builds the repository's own
  # projects against each other, because that would test the repository rather than the package,
  # and packaging is where this repository fails quietly.
  #
  # What is deliberately absent: a real Android phone and a real iPhone. A hosted runner has
  # neither, and the substitutes test the wrong binary - the Android emulator runs the x86_64 ABI
  # from libwebrtc.aar, and the iOS Simulator the simulator slice of WebRTC.xcframework, where
  # arm64 is what a user installs. Those two stay a pre-release ritual, one command each:
  #
  #   ./Tests/Test-Device-Phase4.ps1 -Platform android
  #   ./Tests/Test-Device-Phase4.ps1 -Platform ios -DeviceId <paired identifier>
  #
  # A green run here is therefore not device verification, and should not be read as it. It is
  # still worth having: both faults found on 2026-09-15 were managed-code faults - a null
  # dereference and a serialisation shape - and every job below would have caught one or the other.

  unit:
    name: Unit and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The only tier that references the projects rather than the package, and the only one that
      # needs no artifact - so it does not wait for the build and runs beside it.
      #
      # dotnet run, not dotnet test: xUnit v3 builds its own entry point, and `dotnet test` on the
      # .NET 10 SDK fails to discover these.
      - name: Tier 1
        run: dotnet run --project Tests/WebRTCme.Tests -c Release

  package-tests:
    name: Package consumption
    runs-on: windows-latest
    needs: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # This tier compiles a consumer for every target framework the package ships, so the
      # workloads have to be here. Restoring from the project gets the right set without naming
      # them - and naming them is what goes wrong, since -f narrows the build and not the restore.
      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.PackageTests/WebRTCme.PackageTests.csproj

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      - name: Tier 2
        shell: pwsh
        run: ./Tests/Test-Package.ps1

  windows-runtime:
    name: Runtime - Windows
    runs-on: windows-latest
    needs: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # Loads WebRtcInterop.dll and negotiates between two peer connections in one process.
      #
      # A hosted runner has no camera and no microphone, which makes this more interesting than it
      # sounds rather than less: creating a peer connection goes through libwebrtc's audio device
      # module, and that module is what stopped counting inputs after a call in the bug fixed on
      # 2026-09-14. If this job turns out to skip the enumeration scenarios, or to fail outright on
      # a machine with no audio at all, that is worth knowing and is written down here rather than
      # assumed either way.
      - name: Tier 3
        shell: pwsh
        run: ./Tests/Test-Device.ps1

  blazor:
    name: Runtime - Blazor
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # No hardware at all: Chromium is launched with its fake-media-device switches, so there is a
      # synthetic camera and microphone. The one tier that is as good in CI as it is locally.
      - name: Tier 5
        shell: pwsh
        run: ./Tests/Test-Blazor.ps1

  maccatalyst:
    name: Runtime - Mac Catalyst
    runs-on: macos-latest
    needs: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.DeviceTests.Runner/WebRTCme.DeviceTests.Runner.csproj

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # -Local: the Mac is this machine rather than the Mac mini over SSH. No signing identity is
      # needed to run a Catalyst app from its own build output, and no window server session
      # either, which is what makes this one as good here as it is on real hardware - it IS real
      # hardware, and the same slice a user gets.
      - name: Tier 4 - Mac Catalyst
        shell: pwsh
        run: ./Tests/Test-Device-Phase4.ps1 -Platform maccatalyst -Local

  ios-simulator:
    name: Runtime - iOS Simulator
    runs-on: macos-latest
    needs: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.DeviceTests.Runner/WebRTCme.DeviceTests.Runner.csproj

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # The Simulator, not a phone, with everything that implies - see the note at the top of this
      # section. The simulator is chosen from whatever the runner image has rather than pinned to a
      # model, which would break the day GitHub changes the image.
      - name: Tier 4 - iOS Simulator
        shell: pwsh
        run: ./Tests/Test-Device-Phase4.ps1 -Platform ios -Local -Simulator

  android-emulator:
    name: Runtime - Android emulator
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload restore Tests/WebRTCme.DeviceTests.Runner/WebRTCme.DeviceTests.Runner.csproj

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # The emulator needs hardware acceleration, and a hosted Linux runner only grants /dev/kvm to
      # a user in the kvm group. Without this the emulator either refuses to start or falls back to
      # software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # An emulator is just another adb device, so the harness needs no emulator-specific path - it
      # builds, installs with -t:Install and reads logcat exactly as it does with a phone.
      #
      # x86_64 deliberately: that is the only ABI with a usable emulator image, and it is also the
      # honest limitation of this job - libwebrtc.aar's arm64 ABI is the one that reaches a user's
      # phone, and nothing here loads it.
      - name: Tier 4 - Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: pwsh ./Tests/Test-Device-Phase4.ps1 -Platform android
